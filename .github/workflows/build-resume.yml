name: Build and Release Resume

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install localleaf
        run: |
          curl -fsSL https://raw.githubusercontent.com/loiccoyle/localleaf/main/localleaf \
            -o /usr/local/bin/localleaf
          chmod +x /usr/local/bin/localleaf

      - name: Disable podman to avoid registry-selection prompt in CI
        run: sudo mv /usr/bin/podman /usr/bin/podman.disabled || true

      - name: Compile LaTeX with localleaf
        run: |
          script -qec "localleaf -m resume.tex -e xelatex -i docker.io/loiccoyle/localleaf:latest -1 . -- --outdir=build/" /dev/null

      - name: Fix build output ownership
        run: sudo chown -R "$USER":"$USER" build/

      - name: Rename PDF
        run: mv build/resume.pdf caleb_cunningham_resume.pdf

      - name: Get next version
        id: version
        run: |
          latest=$(gh release list --repo ${{ github.repository }} --limit 1 \
            --json tagName --jq '.[0].tagName' 2>/dev/null || echo "v0")
          num=${latest#v}
          echo "tag=v$((num + 1))" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Resume ${{ steps.version.outputs.tag }}
          files: caleb_cunningham_resume.pdf